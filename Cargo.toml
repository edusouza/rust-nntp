[workspace]
members = [
    "crates/nntp-proto",
    "crates/nntp-client",
    "crates/nntp-testserver",
    "crates/nntp-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edusouza/rust-nntp"
authors = ["rust-nntp contributors"]
keywords = ["nntp", "usenet", "news", "tui"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
# Internal crates
nntp-proto = { path = "crates/nntp-proto", version = "0.1.0" }
nntp-client = { path = "crates/nntp-client", version = "0.1.0" }
nntp-testserver = { path = "crates/nntp-testserver", version = "0.1.0" }

# External
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "alloc"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6"
encoding_rs = "0.8"
memchr = "2"
ratatui = "0.30"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"

# Dev
insta = "1"
rcgen = "0.14"
pretty_assertions = "1"

# Lints applied to every crate in the workspace via `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# Deny the classes of bug that are easy to introduce in protocol/parser code.
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
